<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
  <meta name="apple-mobile-web-app-title" content="Horse Runner" />
  <meta name="theme-color" content="#0a0a14" />
  <link rel="manifest" href="/manifest.json" />
  <title>Horse Runner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      width: 100%; height: 100%;
      background: #0a0a14;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* --banner-h, banner gösterilirken AdService tarafından ayarlanır;
       böylece arayüzün altı reklamın arkasında kalmaz. */
    #root { width: 100%; height: 100%; padding-bottom: var(--banner-h, 0px); }
  </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
